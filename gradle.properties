# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The Minecraft version: versions/<mc>/gradle.properties holds its Minecraft and NeoForge versions.
# ./gradlew build builds for 26.3, ./gradlew build -Pmc=26.1 for 26.1.2.
mc=26.3

## Mod Properties
mod_id=empirewand
mod_name=Empire Wand
# GNU GPL v3 only (owner, 31 Oct 2026), like Bleep
mod_license=GPL-3.0-only
mod_version=2.0.0
mod_group_id=io.hookdev.empirewand
