modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/ParadiseArchive/empire-wand/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ParadiseArchive/empire-wand"
authors="Hook Development"
description='''
A wand from 2013, rebuilt: the Empire Wand, with thirty spells to find as scrolls round the world.
Right-click picks a spell, left-click casts it, hold it to charge. No cooldown.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
