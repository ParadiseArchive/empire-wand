modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Hook Development"
description='''
Two wands from 2013, rebuilt: the Empire Wand with seventeen spells and Blood Magic with three.
Right-click picks a spell, left-click casts it.
'''

